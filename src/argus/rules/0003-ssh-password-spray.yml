id: ARGUS-0003
title: SSH password spray across many accounts
description: >
  One source address fails authentication against several distinct usernames
  in a short window. Password spraying tries a small number of common passwords
  across many accounts to avoid lockout.
severity: high
logsource:
  product: linux
  service: sshd
detection:
  selection:
    action: ssh_auth_failed
  condition: selection
timeframe: 5m
group_by: [src_ip]
threshold:
  count: 6
  op: gte
  distinct: [user]
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.003
falsepositives:
  - Vulnerability scanners or authorized penetration tests.
  - A bastion host with a broken account mapping trying several local names.
  - Shared proxy addresses used by multiple users with stale credentials.

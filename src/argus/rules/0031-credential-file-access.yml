id: ARGUS-0031
title: Credential file read
description: >
  A command reads a file commonly used to store secrets, such as cloud
  credentials, private SSH keys, container registry configuration, kubeconfig
  or a dotenv file. This is a common credential access step after initial
  compromise.
severity: high
logsource:
  product: linux
  service: auth
detection:
  selection:
    action: secret_file_access
  condition: selection
group_by: [host]
tags:
  - attack.credential_access
  - attack.t1552
  - attack.t1552.001
falsepositives:
  - Deployment automation reading credentials at runtime.
  - Backup processes that collect configuration files.
  - An administrator deliberately inspecting a credential file.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Bandit
        run: bandit -r src
      - name: Test
        run: pytest --cov=argus --cov-report=term-missing
      - name: CLI smoke test
        run: |
          python -m argus version
          argus scan examples/logs/benign --min-severity medium --year 2026
          argus rules validate
          argus attack-matrix > /dev/null
